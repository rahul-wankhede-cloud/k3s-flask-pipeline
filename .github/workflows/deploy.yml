name: Deploy to K3s
on:
  push:
    branches: [ main ]

# Give the token permission to write to the registry
permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest # This runs on GitHub's cloud servers
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Replace 'your-username' with your actual GitHub username (lowercase)
          tags: ghcr.io/${{ github.actor }}/flask-app:latest

  deploy:
    needs: build-and-push # Only deploy if the build succeeds
    runs-on: self-hosted  # This runs on your HP Laptop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to K3s
        run: |
          # Use the full GHCR image path in the command or update the yaml
          kubectl apply -f deployment.yaml
          kubectl rollout restart deployment flask-app